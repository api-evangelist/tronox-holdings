domain_standards:
  note: >-
    No domain standard declared. Tronox's supplier exchange runs on the Coupa Supplier Portal
    (Coupa's cXML/EDI surface, not Tronox's) and its customer commerce is contract-negotiated;
    no Tronox-published contract carries a chemicals/mining data standard. Reward-only check;
    nothing invented to fill it.
