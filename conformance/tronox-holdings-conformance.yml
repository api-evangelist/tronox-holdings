summary: >-
  Tronox publishes no API contract, so no contract-level standard (OpenAPI, JSON:API, OData,
  RFC 9457, FHIR, SCIM) can be asserted. The only protocol standards observable on a Tronox
  host are the OAuth 2.0 discovery documents and the MCP endpoint served by the WordPress
  MCP Adapter on www.tronox.com. No domain standard for the chemicals or mining market
  (e.g. CDX/eCl@ss product data, EDIFACT/X12 order messages) is declared anywhere public.
