summary: >-
  Tronox publishes no error reference. The catalog below is the set of error bodies actually
  observed on anonymous requests to the WordPress MCP Adapter and Abilities API routes on
  www.tronox.com. They are WordPress REST envelopes, not RFC 9457 problem details, and they
  are the platform's errors rather than Tronox-authored ones.
problem_types:
- code: mcp_unauthorized
  status: 401
  title: MCP authentication required.
  observed_on: POST /wp-json/mcp/mcp-oauth-server
  remediation: >-
    Obtain a bearer token through the authorization_code + PKCE flow described in
    https://www.tronox.com/.well-known/oauth-authorization-server/ with scope "mcp" and send it
    in the Authorization header (bearer_methods_supported: header).
- code: rest_forbidden
  status: 401
  title: Sorry, you are not allowed to do that.
  observed_on: POST /wp-json/mcp/mcp-adapter-default-server; GET /wp-json/wp-abilities/v1/abilities
  remediation: >-
    These routes authenticate as a WordPress user (cookie/nonce or application password), not
    through the public OAuth server; there is no published anonymous path to them.
- code: rest_no_route
  status: 404
  title: No route was found matching the URL and request method.
  observed_on: POST /wp-json/mcp
  remediation: The namespace root only accepts GET; POST JSON-RPC to /wp-json/mcp/mcp-oauth-server.
