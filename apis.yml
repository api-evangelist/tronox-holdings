apis:
  - aid: tronox-holdings:tronox-mcp-server
    name: Tronox MCP Server (WordPress MCP Adapter)
    tags:
      - MCP
      - Agents
      - WordPress
    tags_raw:
      - MCP
      - Agents
      - WordPress
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    baseURL: https://www.tronox.com/wp-json/mcp/mcp-oauth-server
    humanURL: https://www.tronox.com/
    description: >-
      An authenticated Model Context Protocol (MCP) endpoint served from Tronox's own corporate
      WordPress host, found by probe on 2026-09-17 rather than by documentation. Anonymous
      discovery works end to end: the 401 carries a WWW-Authenticate resource_metadata pointer,
      the site publishes RFC 9728 protected-resource metadata and RFC 8414 authorization-server
      metadata advertising an authorization_code + PKCE (S256) flow with a single "mcp" scope,
      and the WordPress REST index confirms the mcp and wp-abilities/v1 namespaces. tools/list
      itself returns 401 mcp_unauthorized without a bearer token, so the live tool schemas could
      not be introspected. This is the platform-authored content surface of the marketing site,
      not a Tronox product, order or supply-chain API - Tronox publishes none. The hosts the
      previous record carried, api.tronox.com and developer.tronox.com, do not exist (NXDOMAIN).
    properties:
      - type: MCPServer
        url: mcp/tronox-holdings-mcp.yml
      - type: Authentication
        url: authentication/tronox-holdings-authentication.yml
      - type: OAuthScopes
        url: scopes/tronox-holdings-scopes.yml
      - type: ErrorCatalog
        url: errors/tronox-holdings-problem-types.yml
