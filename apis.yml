description: >-
  Tronox Holdings plc is a vertically integrated producer of titanium dioxide (TiO2) pigment,
  mineral sands (titanium feedstock and zircon) and titanium chemicals, a Fortune 1000 chemicals
  and mining company operating mines and plants on three continents. It runs no developer program
  and publishes no product API, SDK or machine-readable contract; supplier transactions run on the
  third-party Coupa Supplier Portal and customer supply is contracted directly. The one protocol
  surface on a Tronox host is an OAuth-gated MCP endpoint served by the WordPress MCP Adapter on
  the corporate site, recorded here as a probed platform surface rather than a Tronox business API.
